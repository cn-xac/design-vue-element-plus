name: zztest4

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test and publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout extension package
        uses: actions/checkout@v4
        with:
          path: ext

      - name: Checkout monorepo (resolves link: deps to @x-ac/design-core / design-vue)
        uses: actions/checkout@v4
        with:
          repository: cn-xac/web-desgin
          path: project

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ext/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ext
        run: pnpm install --frozen-lockfile
